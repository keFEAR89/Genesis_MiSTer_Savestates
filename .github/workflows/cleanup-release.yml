name: Cleanup release tree
on:
  push:
    paths: ['.github/workflows/cleanup-release.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove non-release upstream artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf releases .github
          rm -f Genesis_Q13.qpf Genesis_Q13.qsf Genesis_Q13.srf Genesis.srf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean public R58 release tree [skip ci]'
          git push origin HEAD:main
