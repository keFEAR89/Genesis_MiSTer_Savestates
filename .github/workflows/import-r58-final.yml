name: Final R58 import

on:
  push:
    paths: ['.github/workflows/import-r58-final.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify final R58
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r58
          git clone --depth 1 https://github.com/MiSTer-devel/Genesis_MiSTer.git /tmp/r58
          rm -rf /tmp/r58/.git /tmp/r58/docs
          cd /tmp/r58
          mv README.md README_UPSTREAM.md

          get_file() {
            local id="$1" out="$2"
            mkdir -p "$(dirname "$out")"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" -o "$out"
            test -s "$out"
          }

          # Final project files and release metadata
          get_file 1L_P4uzyysSj9trHzLnqRLE9l5NYCmllS Genesis.sv
          get_file 1-1vxnPdFzc7K5fTfEPoswGZbSYVyMCGW Genesis.qpf
          get_file 1BUURrVr61vSq2UOTYetg3SkLlUmyIwnZ Genesis.qsf
          get_file 1Cql4xH3eehljLYS7ipbzbVov9G1-oh_4 Genesis.sdc
          get_file 1V0OD4yTYFzbIqARkmsu11kXJN7erlaUl files.qip
          get_file 1DC8M1smqXceq-ME1rXQG7LZKhU5x_beI build_id.v
          get_file 1FEygRtTkro4oCYJOHyuhNjRgEvKjzVhX clean.bat
          get_file 1q0bWPoXQ0S-n1uY2TgDp7FHfhNW-UDua .gitignore
          get_file 1Bg4kCSMVYlFMBCjJUpf20S5RkEdzY1l4 LICENSE
          get_file 1eLE7qxblrKyw7fhuLqtL8gju5PlUFcWD README_R58_RU.md
          get_file 1PrDjHHv9UVTBOgTrt8IUkFeNVsNJal0n R58_SOURCE_MANIFEST.json
          get_file 1_YIHllgLQj1GLNi21vdwVNoJEkrPs-09 R58_changes.diff
          get_file 1i_NQSWm-O_IBHLXhZpkAOZ42ru31epLu Genesis_SS.rbf

          # Savestate implementation
          get_file 1TmtY26447tdbhS2MjTECFSCLUxiBAkJ6 rtl/savestate/ss_freeze_ctrl.sv
          get_file 149BKmDhXYg7Dr_w6rf7stvXySkru2B6c rtl/savestate/ss_m68k_handler_test.sv
          get_file 1GhffX2FcSU20PVqvOHwriIr0S6DmD1ys rtl/savestate/ss_persistent_export.sv
          get_file 1N8BtN5giEp6mDxVSKFbO97nXIU4uG8m8 rtl/savestate/ss_ram_test.sv
          get_file 1uocXqUDYJftOriX9A1t6H_krt4vZ7GX8 rtl/savestate/ss_rom_identity.sv
          get_file 16MxlFBsFlSxLJG66v8adpEIKLmV1W37h rtl/savestate/ss_slot_engine.sv
          get_file 1KFb4zrEjKZ7mIHuhj-0yHkaxW205wk-R rtl/savestate/ss_snapshot_orchestrator.sv
          get_file 1yXO_rLFUDBo9NkvDDfTfXJCHJxHjKMnN rtl/savestate/ss_system_state.sv
          get_file 19WrIE_mGK5PJIHCLc2A--5Ec2qFCppHA rtl/savestate/ss_z80_state_test.sv

          # Integrated state access / restore changes
          get_file 1YMWAv2WrfP20OXhaW15qWRkZyNfmNu5G rtl/ddram.sv
          get_file 1sfUVQHjMNqHpV_9F8X9wwNl5zDXEKn10 rtl/fourway.v
          get_file 10IyW88jgJiFiX-SezIw_IKA6WXqx7irU rtl/gen_io.sv
          get_file 1Tx9GDKkcU4B3S6xENu8b9_SxLbrsF6rw rtl/multitap.sv
          get_file 1ulRMDLdvmHdt7hfxg4IoGijb52v141wG rtl/sdram.sv
          get_file 120se0nD8mfr6fuC0NlaL2g8QEBsLF3Cx rtl/system.sv
          get_file 1iSIkzmDMRlcy_LswcDd8XC1ifakdtYuf rtl/vdp.vhd
          get_file 181egsPPR238neYqmE0vBaZhvr-1GjsIA rtl/T80/T80.vhd
          get_file 1U4VfRTrrGnjYQibaAxat6KW_kYHcTuqk rtl/T80/T80s.vhd

          # Final cleanup/timing source changes
          get_file 1RfCko18aSi3yUHsc1Kufzr5fvCha1hW3 rtl/jt12/adpcm/jt10_adpcm_div.v
          get_file 1fs6BXQrh7iaH_OWJtVUkwMJpRyKYgsZW rtl/jt12/jt12_pcm_interpol.v
          get_file 1WQBUQSBx0mug-1GaqxTVu53Ai0lkFSbi rtl/jt12/jt12_pm.v
          get_file 1XojWZZFVMhg9gm32CcpJg6s9fay5BLJf rtl/jt12/jt12_timers.v
          get_file 1mQh_9xTqdLh-_MaplsmjvhQfHPQ2S4gu rtl/pll/pll_0002.qip
          get_file 1vnepoKQaPpvN8JIZuDWV4CyUcrz-mqeW sys/ascal.vhd
          get_file 1CPqC8QJwQv2BDEHIlSheETwAsertBDVZ sys/pll_cfg/altera_pll_reconfig_core.v
          get_file 1k5wthcGbqMmPG4_pq3T7ZHDOvmNeGE5g sys/pll_hdmi/pll_hdmi_0002.qip
          get_file 1BjWRRynfU2cTrvFoD06BZBIwyDmCf6lo sys/sys.tcl
          get_file 1ij6bbgDUcvFzImmwA4k88zD-sMPXuVAA sys/pll_q18.qip

          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path('.')
          m=json.loads((root/'R58_SOURCE_MANIFEST.json').read_text(encoding='utf-8-sig'))
          bad=[]; checked=0
          for e in m.get('verified_sources',[]):
              p=root/e['path']
              if not p.is_file():
                  bad.append((e['path'],'MISSING',e['sha256'])); continue
              got=hashlib.sha256(p.read_bytes()).hexdigest(); checked+=1
              # Genesis.qsf was modified after the source manifest was prepared;
              # verify the live final-build QSF separately below.
              if e['path']=='Genesis.qsf': continue
              if got.lower()!=e['sha256'].lower(): bad.append((e['path'],got,e['sha256']))
          qsf=hashlib.sha256((root/'Genesis.qsf').read_bytes()).hexdigest()
          final_qsf='cd4f4470c8ed8bba6e422bdffa18b2dc1553a3d3322539c85d0b5b7e84a25e32'
          if qsf!=final_qsf: bad.append(('Genesis.qsf',qsf,final_qsf))
          print('verified files:',checked)
          if bad:
              for x in bad: print('MISMATCH',*x)
              sys.exit(2)
          print('R58 source verification PASS (live QSF override)')
          PY

          test "$(stat -c%s Genesis_SS.rbf)" -gt 3000000

          cat > README.md <<'EOF'
          # Genesis MiSTer — Savestates R58

          R58 of the archived **MiSTer-devel/Genesis_MiSTer** core with working FPGA savestates.

          ## Contents
          This repository contains the complete R58 Quartus project, the savestate implementation in `rtl/savestate/`, all integrated CPU/VDP/system changes, release metadata, and the tested `Genesis_SS.rbf` binary.

          The original upstream README is preserved as `README_UPSTREAM.md`. Detailed development notes are in `README_R58_RU.md`.

          ## Savestates
          R58 provides four persistent save-state slots. State data is stored through MiSTer's external DDR/file-backed savestate area. States are associated with ROM identity and relevant machine settings, and data is verified during save/load.

          ## Building
          Use **Quartus Prime 18.1 Standard**. Open `Genesis.qpf`, select revision `Genesis`, and perform a full compilation. The project is configured for 6 parallel processors. Always re-check setup slack, hold slack and TNS after rebuilding.

          ## Upstream
          Based on the archived [MiSTer-devel/Genesis_MiSTer](https://github.com/MiSTer-devel/Genesis_MiSTer) project.

          ## License
          The upstream `LICENSE` and source copyright notices are retained. Preserve applicable notices when redistributing or modifying the project.
          EOF

      - name: Publish verified R58
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/r58/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish verified R58 Genesis MiSTer savestate release [skip ci]'
          git push origin HEAD:main
