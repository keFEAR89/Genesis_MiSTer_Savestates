name: Import R58 source release

on:
  push:
    paths:
      - '.github/workflows/import-r58.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-r58:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download only final R58 sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check 'gdown>=6.0.0'

          rm -rf /tmp/r58-release /tmp/r58-rtl /tmp/r58-sys
          mkdir -p /tmp/r58-release /tmp/r58-rtl /tmp/r58-sys

          # Download only the live source trees. Do not crawl audit/, verification/,
          # old releases or output reports from the project root.
          gdown --folder 'https://drive.google.com/drive/folders/1kPVsEJBvjMWplqrKKgtpzYWGJEaUo7GI' -O /tmp/r58-rtl
          gdown --folder 'https://drive.google.com/drive/folders/14yFVUKb9YxDaePtITBR5DHzFRj7ip8AF' -O /tmp/r58-sys

          RTL_SYSTEM="$(find /tmp/r58-rtl -type f -name system.sv -print -quit)"
          SYS_TOP="$(find /tmp/r58-sys -type f -name sys_top.v -print -quit)"
          test -n "$RTL_SYSTEM" || { echo 'rtl/system.sv not downloaded' >&2; exit 1; }
          test -n "$SYS_TOP" || { echo 'sys/sys_top.v not downloaded' >&2; exit 1; }
          RTL_ROOT="$(dirname "$RTL_SYSTEM")"
          SYS_ROOT="$(dirname "$SYS_TOP")"

          mkdir -p /tmp/r58-release/rtl /tmp/r58-release/sys
          cp -a "$RTL_ROOT"/. /tmp/r58-release/rtl/
          cp -a "$SYS_ROOT"/. /tmp/r58-release/sys/

          get_file() {
            local id="$1" out="$2"
            gdown "https://drive.google.com/uc?id=${id}" -O "/tmp/r58-release/${out}"
            test -s "/tmp/r58-release/${out}" || { echo "Failed: ${out}" >&2; exit 1; }
          }

          # Exact live root files from the final Drive tree.
          get_file '1L_P4uzyysSj9trHzLnqRLE9l5NYCmllS' 'Genesis.sv'
          get_file '1-1vxnPdFzc7K5fTfEPoswGZbSYVyMCGW' 'Genesis.qpf'
          get_file '1BUURrVr61vSq2UOTYetg3SkLlUmyIwnZ' 'Genesis.qsf'
          get_file '1Cql4xH3eehljLYS7ipbzbVov9G1-oh_4' 'Genesis.sdc'
          get_file '1V0OD4yTYFzbIqARkmsu11kXJN7erlaUl' 'files.qip'
          get_file '1DC8M1smqXceq-ME1rXQG7LZKhU5x_beI' 'build_id.v'
          get_file '1FEygRtTkro4oCYJOHyuhNjRgEvKjzVhX' 'clean.bat'
          get_file '1q0bWPoXQ0S-n1uY2TgDp7FHfhNW-UDua' '.gitignore'
          get_file '1Bg4kCSMVYlFMBCjJUpf20S5RkEdzY1l4' 'LICENSE'
          get_file '1rvgqUowYbEJVuxXecnoSVoLfsabM8GxW' 'README_UPSTREAM.md'
          get_file '1eLE7qxblrKyw7fhuLqtL8gju5PlUFcWD' 'README_R58_RU.md'
          get_file '1PrDjHHv9UVTBOgTrt8IUkFeNVsNJal0n' 'R58_SOURCE_MANIFEST.json'
          get_file '1_YIHllgLQj1GLNi21vdwVNoJEkrPs-09' 'R58_changes.diff'
          get_file '1i_NQSWm-O_IBHLXhZpkAOZ42ru31epLu' 'Genesis_SS.rbf'

          # Sanity checks for the savestate-specific source set.
          for f in \
            rtl/savestate/ss_slot_engine.sv \
            rtl/savestate/ss_snapshot_orchestrator.sv \
            rtl/savestate/ss_system_state.sv \
            rtl/savestate/ss_m68k_handler_test.sv \
            rtl/savestate/ss_rom_identity.sv \
            rtl/ddram.sv rtl/system.sv rtl/vdp.vhd; do
            test -s "/tmp/r58-release/$f" || { echo "Missing required source: $f" >&2; exit 1; }
          done

      - name: Create public README
        shell: bash
        run: |
          cat > /tmp/r58-release/README.md <<'EOF'
          # Genesis MiSTer — Savestates R58

          R58 of the archived **MiSTer-devel/Genesis_MiSTer** core with working FPGA savestates.

          ## Contents

          This repository contains the complete R58 Quartus project, including `rtl/`, `sys/`, the savestate implementation in `rtl/savestate/`, project files, the source manifest, development diff and the tested `Genesis_SS.rbf` binary.

          The original upstream README is preserved as `README_UPSTREAM.md`. Detailed R58 development notes are in `README_R58_RU.md`.

          ## Savestates

          R58 provides four persistent save-state slots. The state image is stored through MiSTer's external DDR/file-backed savestate area. Saved states are tied to ROM identity and relevant machine settings, and data is verified before restore.

          ## Building

          Use **Quartus Prime 18.1 Standard**. Open `Genesis.qpf`, revision `Genesis`, then run a full compilation. The development project uses 6 parallel processors. Always check setup slack, hold slack and TNS for a newly compiled RBF.

          ## Upstream

          Based on the archived [MiSTer-devel/Genesis_MiSTer](https://github.com/MiSTer-devel/Genesis_MiSTer) core.

          ## Development

          The source is published so the MiSTer community can inspect, test and extend the savestate implementation. Potential follow-up work includes broader special-hardware/peripheral coverage and further compatibility testing.

          ## License

          The upstream `LICENSE` and source copyright notices are retained. Preserve all applicable notices when redistributing modified versions.
          EOF

      - name: Publish clean R58 tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/r58-release/. .

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish R58 Genesis MiSTer savestate source release [skip ci]'
          git push origin HEAD:main
